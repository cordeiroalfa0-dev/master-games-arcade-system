name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Verificar intro.html no dist (Regra 1)
        run: if not exist dist\intro.html exit /b 1
        shell: cmd
      - run: npm run electron:pack
      - uses: actions/upload-artifact@v4
        with:
          name: MasterGamesArcade-Setup
          path: release/*.exe
