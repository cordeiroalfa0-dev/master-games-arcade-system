<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Games Arcade — Diagnóstico de Controles</title>
<style>
:root{--bg:#07111f;--panel:#0d1c30;--line:#214e70;--cyan:#53e6ff;--green:#6cff9e;--pink:#ff8ad8;--gold:#ffd56a;--red:#ff6b8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#173452 0,#07111f 45%,#02050a 100%);color:#dff8ff;font:14px Segoe UI,Arial,sans-serif;padding:28px}h1,h2{font-family:Consolas,monospace;letter-spacing:1px}h1{color:var(--cyan);margin:0 0 8px}h2{font-size:16px;color:var(--pink);margin:0 0 14px}.sub{color:#9bc4d5;margin-bottom:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{background:#103653;border:1px solid var(--cyan);color:var(--cyan);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:700}button:hover{background:#175375}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.panel{background:rgba(13,28,48,.88);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 0 20px #0008}.status{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.dot.fail{background:var(--red);box-shadow:0 0 12px var(--red)}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid #1b3a54;vertical-align:top}td:first-child{color:#91b8c9;width:43%}code{color:var(--gold);font-family:Consolas,monospace;word-break:break-word}.sequence{background:#06101c;border:1px solid #265676;border-radius:6px;padding:10px;margin-top:10px;font-family:Consolas,monospace;color:var(--gold);min-height:42px}.event{padding:8px 10px;margin:6px 0;border-left:3px solid var(--cyan);background:#091726}.pass{color:var(--green)}.warn{color:var(--gold)}.fail{color:var(--red)}#log{white-space:pre-wrap;max-height:230px;overflow:auto;color:#acd5e3;font:12px Consolas,monospace}
</style></head><body>
<h1>MASTER GAMES ARCADE · DIAGNÓSTICO VISUAL</h1>
<div class="sub">Teste isolado do sistema de controles. Nenhum EXE é gerado nesta página.</div>
<div class="toolbar"><button id="run">Executar testes novamente</button><button id="live">Ler gamepads reais do navegador</button><button id="capture">Simular captura P2_BUTTON3</button></div>
<div class="grid"><section class="panel"><h2>Resumo do motor</h2><div id="summary"></div></section><section class="panel"><h2>Eventos de captura</h2><div id="events"></div></section></div>
<div class="grid" style="margin-top:14px"><section class="panel"><h2>Cenário A · dois encoders idênticos</h2><div id="scenarioA"></div></section><section class="panel"><h2>Cenário B · um encoder compartilhado</h2><div id="scenarioB"></div></section></div>
<section class="panel" style="margin-top:14px"><h2>Log técnico</h2><div id="log"></div></section>
<script>
const logEl=document.querySelector('#log'),eventsEl=document.querySelector('#events');let lines=[];
function log(x){lines.push(new Date().toLocaleTimeString()+' '+x);logEl.textContent=lines.slice(-80).join('\n');}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function padKey(p){return `index:${Number.isFinite(Number(p.index))?Number(p.index):'na'}`}
function joyIndex(profile,player){const m=String(profile.joycodeMap?.[String(player)]||'').match(/^JOYCODE_(\d+)$/);if(m)return Number(m[1]);const s=profile.padMap?.[String(player)];return s&&Number.isFinite(Number(s.index))?Number(s.index)+1:Math.max(1,player)}
function padFor(profile,pads,player){const s=profile.padMap?.[String(player)];if(s){const exact=pads.find(p=>padKey(p)===s.key);if(exact)return exact;const idx=pads.find(p=>String(p.index)===String(s.index));if(idx)return idx}return pads[player-1]||pads[0]}
function card(pads,profile){return pads.map((p,i)=>`<div class="event"><b>Pad ${i+1}</b> · <code>${esc(p.id)}</code><br>índice navegador: <code>${p.index}</code> · padKey: <code>${padKey(p)}</code><br>P1/P2: <code>${Object.entries(profile.padMap).filter(([,v])=>v.key===padKey(p)).map(([k])=>'P'+k).join(', ')||'não atribuído'}</code></div>`).join('')}
function run(){lines=[];eventsEl.innerHTML='<div class="event pass">Geração inicializada: 1</div>';const pads=[{index:0,id:'DragonRise Inc. Generic USB Joystick'},{index:1,id:'DragonRise Inc. Generic USB Joystick'}];const p={padMap:{'1':{key:'index:0',index:0},'2':{key:'index:1',index:1}},joycodeMap:{}};const a1=padFor(p,pads,1),a2=padFor(p,pads,2);const checks=[['padKey distingue IDs iguais',padKey(pads[0])!==padKey(pads[1])],['P1 seleciona índice 0',a1.index===0],['P2 seleciona índice 1',a2.index===1],['P1 vira JOYCODE_1',joyIndex(p,1)===1],['P2 vira JOYCODE_2',joyIndex(p,2)===2]];const shared={padMap:{'1':{key:'index:0',index:0},'2':{key:'index:0',index:0}},joycodeMap:{}};checks.push(['encoder compartilhado mantém P2 no índice 0',padFor(shared,[pads[0]],2).index===0],['encoder compartilhado usa JOYCODE_1 para P2',joyIndex(shared,2)===1]);const ok=checks.every(x=>x[1]);document.querySelector('#summary').innerHTML=`<div class="status"><span class="dot ${ok?'':'fail'}"></span>${ok?'TODOS OS TESTES PASSARAM':'EXISTEM FALHAS'}</div>`+checks.map(([n,v])=>`<div class="event ${v?'pass':'fail'}">${v?'✓':'✗'} ${n}</div>`).join('');document.querySelector('#scenarioA').innerHTML=card(pads,p)+`<div class="sequence">P1_BUTTON3 → JOYCODE_${joyIndex(p,1)}_BUTTON3<br>P2_BUTTON3 → JOYCODE_${joyIndex(p,2)}_BUTTON3</div>`;document.querySelector('#scenarioB').innerHTML=card([pads[0]],shared)+`<div class="sequence">P1/P2 compartilham JOYCODE_${joyIndex(shared,2)}<br>P2_BUTTON3 → JOYCODE_${joyIndex(shared,2)}_BUTTON3</div>`;checks.forEach(([n,v])=>log((v?'PASS ':'FAIL ')+n));}
function simulateCapture(){const before=3,generation=before+1,token='JOYCODE_2_BUTTON3';eventsEl.innerHTML+=`<div class="event pass">Nova captura iniciou com geração <code>${generation}</code>; loops anteriores ficam inválidos.</div><div class="event pass">Borda detectada no botão 3 do pad P2.</div><div class="event pass">Sequência final: <code>${token}</code> — sem OR inicial, duplicado ou token HAT inválido.</div>`;log('CAPTURE P2_BUTTON3 => '+token+'; generation='+generation);}
function live(){const pads=[...(navigator.getGamepads?.()||[])].filter(Boolean);if(!pads.length){eventsEl.innerHTML='<div class="event warn">Nenhum gamepad foi exposto pelo navegador nesta sessão. Isso não invalida o teste do MAME; use o diagnóstico verbose do MAME para IDs reais.</div>';log('LIVE: nenhum gamepad exposto');return}eventsEl.innerHTML=pads.map(p=>`<div class="event pass">${esc(p.id)} · índice ${p.index} · botões ${p.buttons.length} · eixos ${p.axes.length} · padKey ${padKey(p)}</div>`).join('');log('LIVE: '+pads.length+' gamepad(s) detectado(s)');}
document.querySelector('#run').onclick=run;document.querySelector('#capture').onclick=simulateCapture;document.querySelector('#live').onclick=live;run();
</script></body></html>
